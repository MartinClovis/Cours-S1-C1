{% extends 'layout.html' %}

{% block title %}
    <title>Ajouter un type</title>
{% endblock %}

{% block body %}
    <div class="container py-4">
        <h2 class="mb-4">Ajouter un type de commerçant</h2>

        <form action="/type-commercant/add" method="post">
            <div class="mb-3">
                <label for="libelleType" class="form-label">Libellé</label>
                <input type="text" class="form-control bg-light" id="libelleType" name="libelleType" required>
            </div>

            <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm">Enregistrer</button>
        </form>
    </div>
{% endblock %}
