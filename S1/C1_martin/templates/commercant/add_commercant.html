{% extends 'layout.html' %}

{% block title %}
    <title>Ajouter un commerçant</title>
{% endblock %}

{% block body %}
    <div class="container py-4">
        <h2 class="mb-4">Ajouter un commerçant</h2>

        <form action="/commercant/add" method="post">
            <div class="mb-3">
                <label for="nomCommercant" class="form-label">Nom</label>
                <input type="text" class="form-control bg-light" id="nomCommercant" name="nomCommercant" required>
            </div>

            <div class="mb-3">
                <label for="dateInstallation" class="form-label">Date d'installation</label>
                <input type="date" class="form-control" id="dateInstallation" name="dateInstallation">
            </div>

            <div class="mb-3">
                <label for="prixLocation" class="form-label">Prix de location</label>
                <input type="number" class="form-control" id="prixLocation" name="prixLocation">
            </div>

            <div class="mb-3">
                <label for="adresse" class="form-label">Adresse</label>
                <input type="text" class="form-control" id="adresse" name="adresse">
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Image</label>
                <input type="text" class="form-control" id="image" name="image">
            </div>

            <div class="mb-3">
                <label for="typeCommercant_id" class="form-label">Type</label>
                <select class="form-control bg-warning" id="typeCommercant_id" name="typeCommercant_id" required>
                    {% for t in types %}
                        {% if not t.supprime %}
                            <option value="{{ t.id }}">{{ t.libelleType }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm">Enregistrer</button>
        </form>
    </div>
{% endblock %}
